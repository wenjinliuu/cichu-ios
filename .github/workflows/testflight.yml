name: TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "构建号（留空则用 GitHub run number）"
        required: false
        type: string
      marketing_version:
        description: "对外版本号（留空则使用项目中的 1.0）"
        required: false
        type: string
  push:
    tags: ["v*"]

concurrency:
  group: cichu-testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: brew install xcbeautify

      - name: Sync icon source artwork
        run: bash scripts/sync-app-icon.sh

      - name: Generate project
        run: python3 scripts/generate_project.py

      - name: Validate release configuration
        run: |
          test "$TEAM_ID" = "F6FB339Y3Z"
          grep -q 'com.wenjinliu.cichu' Cichu.xcodeproj/project.pbxproj
          grep -q 'ASSETCATALOG_COMPILER_APPICON_NAME' Cichu.xcodeproj/project.pbxproj

      - name: Write App Store Connect API key
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          test -n "$TEAM_ID"
          test -n "$KEY_ID"
          test -n "$ISSUER_ID"
          test -n "$PRIVATE_KEY"
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Resolve version numbers
        id: build
        run: |
          NUMBER="${{ inputs.build_number }}"
          if [ -z "$NUMBER" ]; then NUMBER="${{ github.run_number }}"; fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

          VERSION="${{ inputs.marketing_version }}"
          if [ -n "$VERSION" ]; then
            echo "version_flag=MARKETING_VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive unsigned app
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Cichu.xcodeproj \
            -scheme Cichu \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Cichu.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ steps.build.outputs.number }} \
            ${{ steps.build.outputs.version_flag }} \
            | xcbeautify --renderer github-actions

      - name: Verify archived app and icon
        run: |
          APP_PATH=$(find build/Cichu.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP_PATH"
          test -f "$APP_PATH/Assets.car"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = "com.wenjinliu.cichu"
          find "$APP_PATH" -maxdepth 1 -type f -name 'AppIcon*.png' -print -quit | grep -q .

      - name: Write export options
        run: |
          mkdir -p build
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>upload</string>
          </dict>
          </plist>
          PLIST

      - name: Export, sign, and upload to TestFlight
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Cichu.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            | xcbeautify --renderer github-actions

      - name: Upload dSYMs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cichu-dsyms-${{ steps.build.outputs.number }}
          path: build/Cichu.xcarchive/dSYMs
          if-no-files-found: ignore

      - name: Clean up API key
        if: always()
        run: rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
