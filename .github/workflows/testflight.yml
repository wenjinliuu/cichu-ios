name: TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (blank: GitHub run number)"
        type: string
        required: false
      marketing_version:
        description: "Marketing version override (blank: project default)"
        type: string
        required: false
      dry_run:
        description: "Unsigned archive only; never upload"
        type: boolean
        default: false
  push:
    tags: ["v*"]

concurrency:
  group: cichu-ios-testflight
  cancel-in-progress: false

jobs:
  release:
    uses: wenjinliuu/ios-ci-workflows/.github/workflows/testflight-release.yml@1041aed9c6c57d266ce19e40bc2ffc9dbf615a5a
    with:
      workdir: .
      project: Cichu.xcodeproj
      scheme: Cichu
      bundle_id: com.wenjinliu.cichu
      sync_command: bash scripts/sync-app-icon.sh
      generate_command: python3 scripts/generate_project.py
      build_number: ${{ inputs.build_number || '' }}
      marketing_version: ${{ inputs.marketing_version || '' }}
      dry_run: ${{ inputs.dry_run || false }}
      expected_team_id: F6FB339Y3Z
      artifact_prefix: cichu-
    secrets:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
