name: Build & Test / Agent Preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      simulator_name:
        description: "iPhone simulator model"
        type: string
        default: iPhone 17 Pro
      ios_runtime:
        description: "Installed iOS runtime (for example 26)"
        type: string
        default: '26'
      live_preview:
        description: "Open authenticated browser preview (requires AGENT_PREVIEW_PASSWORD secret)"
        type: boolean
        default: false
      preview_minutes:
        description: "Live preview lifetime, 1-20 minutes"
        type: number
        default: 12

permissions:
  contents: write # Reusable screenshots job requests this scope; simulator job downgrades to read.

concurrency:
  group: agent-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    uses: wenjinliuu/ios-ci-workflows/.github/workflows/agent-preview.yml@bb2e5a343c7f43c38798ec006f94df6f939e36fa
    with:
      workdir: .
      project: Cichu.xcodeproj
      scheme: Cichu
      bundle_id: com.wenjinliu.cichu
      sync_command: bash scripts/sync-app-icon.sh
      generate_command: python3 scripts/generate_project.py
      simulator_name: ${{ inputs.simulator_name || 'iPhone 17 Pro' }}
      ios_runtime: ${{ inputs.ios_runtime || '26' }}
      live_preview: ${{ inputs.live_preview || false }}
      preview_minutes: ${{ fromJSON(format('{0}', inputs.preview_minutes || '12')) }}
      ci_revision: bb2e5a343c7f43c38798ec006f94df6f939e36fa
    secrets:
      AGENT_PREVIEW_PASSWORD: ${{ secrets.AGENT_PREVIEW_PASSWORD }}
