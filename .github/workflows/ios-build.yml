name: Build & Test
on:
  push:
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
    inputs:
      suite:
        description: 测试范围
        type: choice
        options: [fast, ui, full]
        default: full
      record_snapshots:
        description: 录制界面参考图
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: build-test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    uses: wenjinliuu/ios-ci-workflows/.github/workflows/build-test.yml@df71d6096d6d39ea799179cb2635703548b07ae0 # v1.1.0
    with:
      suite: ${{ inputs.suite || 'full' }}
      record_snapshots: ${{ inputs.record_snapshots || (github.event_name == 'push' && contains(github.event.head_commit.message, '[record snapshots]')) }}
  snapshot-references:
    needs: test
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[record snapshots]') && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v8
        with:
          name: recorded-snapshots-${{ github.run_number }}
          path: .recorded
      - name: Commit CI-generated references
        run: |
          cp -R .recorded/. .
          rm -rf .recorded
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '**/__Snapshots__/**'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record CI snapshots for orange and white redesign'
          git push origin HEAD
