name: App Icon Preview

on:
  push:
    branches: [main]
    paths:
      - "DesignAssets/AppIcon/**"
      - "Cichu/Resources/AppIcon.icon/**"
      - "scripts/generate_project.py"
      - "scripts/sync-app-icon.sh"
      - ".github/workflows/icon-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-icon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  icon:
    uses: wenjinliuu/ios-ci-workflows/.github/workflows/app-icon.yml@2e7db029f79b1b3826793251562ed58b8fac0f5b
    with:
      workdir: .
      project: Cichu.xcodeproj
      scheme: Cichu
      icon_path: Cichu/Resources/AppIcon.icon
      sync_command: bash scripts/sync-app-icon.sh
      generate_command: python3 scripts/generate_project.py
